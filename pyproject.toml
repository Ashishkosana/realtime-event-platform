[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-event-platform"
version = "0.1.0"
description = "Durable inbox + SSE catch-up + at-least-once webhooks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ashish Kosana" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
notify = "notify_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notify_platform = ["schema.sql", "static/index.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "drills"]
timeout = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "drills", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["notify_platform"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
